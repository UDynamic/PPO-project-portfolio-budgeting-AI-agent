# notation.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Canonical mapping between code identifiers and academic mathematical notation
# for the Project Portfolio Budgeting MDP environment.
#
# Structure per entry:
#   code:        exact identifier used in env.py / helper.py / CSV exports
#   symbol:      LaTeX math-mode symbol
#   name:        plain-English term (for use in prose / table captions)
#   domain:      value domain (LaTeX)
#   description: one-sentence definition
#   source:      where the value lives  [config | project_profile | project_state |
#                                         milestone_profile | milestone_state |
#                                         portfolio_state | obs_vector | action |
#                                         reward | evm | breach | solver]
#
# Changelog (relative to previous version):
#   - advance_trigger (psi^rec_i) added to project_profile
#   - advance_recovery symbol renamed rho_i -> delta^rec_i in project_profile
#     and milestone_profile; description updated to reflect two-parameter
#     recovery mechanic (threshold + rate)
#   - planned_duration domain widened to Z_{>=0} to accommodate D_i=0
#     (single-period degenerate case); description extended accordingly
#   - horizon description updated to reflect T = max_i(f_i+Delta^max_i)-1
#   - over_duration_window description updated to t >= f_i+Delta^max_i-1
#   - structural section added: n_projects (N) and n_milestones (M_i)
#   - scurve_catchup: planned_progress description updated for D_i=0 case
# ─────────────────────────────────────────────────────────────────────────────


# ═══════════════════════════════════════════════════════════════════════════════
# INDICES
# ═══════════════════════════════════════════════════════════════════════════════

indices:
  - code: i
    symbol: "i"
    name: project index
    domain: "i \\in \\{0,\\ldots,N-1\\}"
    description: Zero-based index of a project within the portfolio.
    source: project_profile

  - code: j
    symbol: "j"
    name: milestone index
    domain: "j \\in \\{0,\\ldots,M_i\\}"
    description: >
      Zero-based index of a milestone for project i.  j=0 is always the
      advance-payment milestone triggered at planned_start; only created
      when phi_i > 0.
    source: milestone_profile

  - code: t_episode
    symbol: "t"
    name: episode time-step
    domain: "t \\in \\{0,\\ldots,T\\}"
    description: Global calendar period index counted from the start of the episode.
    source: portfolio_state

  - code: t_project
    symbol: "\\tau_i"
    name: project time-step
    domain: "\\tau_i \\in \\{0,\\ldots,D_i + \\Delta^{\\max}_i\\}"
    description: >
      Number of active periods elapsed for project i since its planned start;
      incremented only while status = active.
    source: project_state


# ═══════════════════════════════════════════════════════════════════════════════
# STRUCTURAL PARAMETERS  (implementation quantities resolved at reset)
# ═══════════════════════════════════════════════════════════════════════════════

structural:
  - code: n_projects
    symbol: "N"
    name: portfolio size
    domain: "N \\in \\mathbb{Z}_{>0}"
    description: >
      Number of projects in the portfolio.  Sampled from its configured
      distribution at each reset(); determines the dimensions of the
      observation space (7N+2) and action space (N).
    source: config

  - code: n_milestones
    symbol: "M_i"
    name: milestone count
    domain: "M_i \\in \\mathbb{Z}_{>0}"
    description: >
      Number of milestones for project i, excluding the synthetic advance
      milestone j=0.  Determines the lengths of {psi_{i,j}}, {w_{i,j}},
      and {tau^ms_{i,j}}.  Sampled per project at reset().
    source: config


# ═══════════════════════════════════════════════════════════════════════════════
# EPISODE / MDP PARAMETERS
# ═══════════════════════════════════════════════════════════════════════════════

episode:
  - code: horizon
    symbol: "T"
    name: episode horizon
    domain: "T \\in \\mathbb{Z}_{>0}"
    description: >
      Maximum episode length; T = max_i(f_i + Delta^max_i) - 1, so that
      t in {0,...,T} contains exactly f_i + Delta^max_i periods
      (zero-indexed).  Derived automatically at reset(); not a config entry.
    source: portfolio_state

  - code: discount
    symbol: "\\gamma"
    name: discount factor
    domain: "\\gamma \\in [0,1]"
    description: Per-period discount factor applied to net cash-flow rewards.
    source: config

  - code: annual_interest_rate
    symbol: "r"
    name: annual interest rate
    domain: "r \\in [0,1]"
    description: >
      Annual rate used to compute treasury-draw interest.
      Monthly rate is r/12.  Specified as a plain scalar, not a
      distribution entry.
    source: config

  - code: budget_tightness
    symbol: "\\kappa"
    name: budget tightness
    domain: "\\kappa \\in (0,\\infty)"
    description: >
      Scalar multiplier on the sum of all BACs that sets the initial
      portfolio budget: B_0 = kappa * sum_i BAC_i.
    source: config

  - code: initial_budget
    symbol: "B_0"
    name: initial budget
    domain: "B_0 \\in \\mathbb{R}_{\\geq 0}"
    description: >
      Portfolio cash reserve at episode start, before any advance payments.
      B_0 = kappa * sum_i BAC_i.  Derived at reset().
    source: portfolio_state

  - code: budget_available
    symbol: "B_t"
    name: available budget
    domain: "B_t \\in \\mathbb{R}"
    description: >
      Portfolio cash reserve at the start of period t after all inflows and
      outflows of the previous period have settled.
    source: portfolio_state

  - code: net_cashflow
    symbol: "\\Delta B_t"
    name: net cash-flow
    domain: "\\Delta B_t \\in \\mathbb{R}"
    description: >
      Period-t portfolio net cash-flow: total inflows minus total outflows
      across all projects.  Budget update: B_{t+1} = B_t + Delta B_t.
    source: portfolio_state


# ═══════════════════════════════════════════════════════════════════════════════
# ACTION & REWARD
# ═══════════════════════════════════════════════════════════════════════════════

action_reward:
  - code: action[i]    # raw fraction element i of the action vector
    symbol: "\\alpha_{i,t}"
    name: allocation fraction
    domain: "\\alpha_{i,t} \\in [0,1],\\; \\sum_i \\alpha_{i,t} \\leq 1"
    description: >
      Fraction of the available budget B_t the agent assigns to project i
      in period t.  Only active projects receive non-zero fractions.
    source: action

  - code: allocation   # monetary amount after scaling; proj_cf["allocation"]
    symbol: "x_{i,t}"
    name: budget allocation
    domain: "x_{i,t} \\in [0, BAC_i / \\eta^{\\min}_i]"
    description: >
      Monetary allocation to project i in period t:
      x_{i,t} = alpha_{i,t} * B_t, capped at BAC_i / eta^min_i.
    source: project_state

  - code: reward
    symbol: "r_t"
    name: period reward
    domain: "r_t \\in \\mathbb{R}"
    description: >
      Discounted net cash-flow reward for period t:
      r_t = gamma^t * Delta B_t.
    source: reward

  - code: _cum_reward   # env attribute; "cum_reward" in info dict
    symbol: "G"
    name: cumulative (episode) reward / NPV
    domain: "G \\in \\mathbb{R}"
    description: >
      Sum of discounted net cash-flows over the full episode:
      G = sum_{t=0}^{T} gamma^t * Delta B_t.
      Used as the primary performance metric (episode NPV).
    source: reward


# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT PROFILE  (sampled once per episode at reset)
# ═══════════════════════════════════════════════════════════════════════════════

project_profile:
  - code: bac
    symbol: "BAC_i"
    name: budget at completion
    domain: "BAC_i \\in \\mathbb{R}_{>0}"
    description: Total planned cost (Budget At Completion) for project i.
    source: project_profile

  - code: profit_percent
    symbol: "\\pi_i"
    name: profit percentage
    domain: "\\pi_i \\in [0,1]"
    description: Mark-up rate; contract price = BAC_i * (1 + pi_i).
    source: project_profile

  - code: price
    symbol: "P_i"
    name: contract price
    domain: "P_i \\in \\mathbb{R}_{>0}"
    description: >
      Total contractual revenue from project i upon full delivery:
      P_i = BAC_i * (1 + pi_i).
    source: project_profile

  - code: planned_start
    symbol: "s_i"
    name: planned start
    domain: "s_i \\in \\mathbb{Z}_{\\geq 0}"
    description: Episode period at which project i is scheduled to begin.
    source: project_profile

  - code: planned_duration
    symbol: "D_i"
    name: planned duration
    domain: "D_i \\in \\mathbb{Z}_{\\geq 0}"
    description: >
      Number of active periods planned for project i.  D_i = 0 is the
      degenerate single-period case: PV_i collapses to a step function
      equal to 1 at tau = 0, and the manager has exactly one period in
      which to commit the full allocation before the hard deadline fires.
    source: project_profile

  - code: planned_finish
    symbol: "f_i"
    name: planned finish
    domain: "f_i = s_i + D_i"
    description: >
      Episode period at which project i is scheduled to complete;
      derived at reset as f_i = s_i + D_i.
    source: project_profile

  - code: scurve_a
    symbol: "a_i"
    name: S-curve shape parameter alpha
    domain: "a_i \\geq 0.5"
    description: >
      First shape parameter of the Beta CDF used as the planned progress
      S-curve for project i.
    source: project_profile

  - code: scurve_b
    symbol: "b_i"
    name: S-curve shape parameter beta
    domain: "b_i \\geq 0.5"
    description: >
      Second shape parameter of the Beta CDF used as the planned progress
      S-curve for project i.
    source: project_profile

  - code: advance_percent
    symbol: "\\phi_i"
    name: advance payment rate
    domain: "\\phi_i \\in [0, 0.3]"
    description: >
      Fraction of contract price P_i paid as an advance at project start:
      Adv_i = phi_i * P_i.  phi_i = 0 disables the advance mechanism
      entirely; no synthetic j=0 milestone is created.
    source: project_profile

  - code: advance_trigger
    symbol: "\\psi^{\\mathrm{rec}}_i"
    name: advance recovery threshold
    domain: "\\psi^{\\mathrm{rec}}_i \\in [0,1]"
    description: >
      Cumulative certified gross payment fraction of P_i above which
      advance recovery deductions commence; corresponds to the FIDIC
      Sub-Clause 14.2 commencement threshold.  When psi^rec_i = 0,
      recovery deductions begin from the first milestone payment.
    source: project_profile

  - code: advance_recovery
    symbol: "\\delta^{\\mathrm{rec}}_i"
    name: advance recovery rate
    domain: "\\delta^{\\mathrm{rec}}_i \\in [0,1]"
    description: >
      Per-milestone deduction rate applied to recover the advance from
      subsequent milestone payments; recovery deduction at milestone j =
      min(delta^rec_i * G_{i,j}, advance remaining).
      Active only when phi_i > 0 and cumulative certified gross payments
      exceed psi^rec_i * P_i.
    source: project_profile

  - code: retention_rate
    symbol: "\\nu_i"
    name: retention rate
    domain: "\\nu_i \\in [0, 0.1]"
    description: >
      Fraction of each milestone's gross payment withheld as retention;
      released in full at the final milestone.
    source: project_profile

  - code: progress_delay_cap
    symbol: "\\delta^{\\max}_i"
    name: progress delay cap (tolerance threshold)
    domain: "\\delta^{\\max}_i \\in [0,1]"
    description: >
      Maximum allowable lag between planned and actual progress before a
      breach flag is raised:
      breach iff (PV_i(t) - EV_i(t)) > delta^max_i.
    source: project_profile

  - code: finish_delay_cap
    symbol: "\\Delta^{\\max}_i"
    name: finish delay cap
    domain: "\\Delta^{\\max}_i \\in \\mathbb{Z}_{>0}"
    description: >
      Maximum additional periods beyond planned_finish before the
      over_duration_window hard termination fires:
      hard deadline fires at t = f_i + Delta^max_i - 1 (zero-indexed).
    source: project_profile

  - code: termination_tolerance
    symbol: "\\theta_i"
    name: termination tolerance
    domain: "\\theta_i \\in \\mathbb{Z}_{>0}"
    description: >
      Number of consecutive breach periods allowed before the project is
      terminated.  tolerance_remain counts down from theta_i each breach.
    source: project_profile


# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT STATE  (updated each step)
# ═══════════════════════════════════════════════════════════════════════════════

project_state:
  - code: status
    symbol: "\\sigma_{i,t}"
    name: project status
    domain: "\\{\\text{pending, active, completed, terminated}\\}"
    description: Lifecycle status of project i at the start of period t.
    source: project_state

  - code: progress_actual
    symbol: "EV_{i,t}"
    name: actual progress (fraction complete)
    domain: "EV_{i,t} \\in [0,1]"
    description: >
      Cumulative fraction of work completed for project i by end of period t;
      equal to BCWP_i / BAC_i in EVM terms.
    source: project_state

  - code: progress_plan_t
    symbol: "PV_{i,t}"
    name: planned progress at t
    domain: "PV_{i,t} \\in [0,1]"
    description: >
      Beta-CDF planned progress at project-time tau_i:
      PV_{i,t} = F_Beta(tau_i / D_i; a_i, b_i) when D_i > 0; equals 1
      when D_i = 0 (degenerate single-period case).
    source: project_state

  - code: progress_delay_t
    symbol: "\\delta_{i,t}"
    name: progress delay
    domain: "\\delta_{i,t} \\in [-1,1]"
    description: >
      Signed lag of actual behind planned progress in period t:
      delta_{i,t} = PV_{i,t} - EV_{i,t}.
      Positive means behind plan.
    source: project_state

  - code: efficiency
    symbol: "\\eta_{i,t}"
    name: work efficiency
    domain: "\\eta_{i,t} \\geq 0.01"
    description: >
      Stochastic cost-to-progress conversion factor drawn each active period:
      progress_increment = (x_{i,t} / BAC_i) * eta_{i,t}.
      custom_ordinal family accepts a per-project sequence for reproducible
      benchmarking; realised after x_{i,t} is committed.
    source: project_state

  - code: inflow
    symbol: "\\mathrm{CF}^{+}_{i}"
    name: cumulative project inflow
    domain: "\\in \\mathbb{R}_{\\geq 0}"
    description: >
      Total cash received by the portfolio from project i up to and including
      the current period (advances + milestone net payments + settlements).
    source: project_state

  - code: outflow
    symbol: "\\mathrm{CF}^{-}_{i}"
    name: cumulative project outflow
    domain: "\\in \\mathbb{R}_{\\geq 0}"
    description: >
      Total cash paid out for project i (allocations + interest charges)
      up to and including the current period.
    source: project_state

  - code: interest_cost    # proj_cf["interest"]
    symbol: "c^{r}_{i,t}"
    name: interest cost
    domain: "c^{r}_{i,t} \\geq 0"
    description: >
      Treasury-draw interest charged to project i in period t:
      c^r_{i,t} = (r/12) * max(0, CF^-_i + x_{i,t} - CF^+_i).
      Accrues whenever cumulative outflows exceed cumulative inflows,
      embedding working-capital discipline directly in the reward signal.
    source: project_state

  - code: tolerance_remain
    symbol: "\\theta^{\\mathrm{rem}}_{i,t}"
    name: tolerance remaining
    domain: "\\theta^{\\mathrm{rem}}_{i,t} \\in \\{0,\\ldots,\\theta_i\\}"
    description: >
      Breach-periods remaining before termination.  Decrements by 1 each
      period a breach flag is active; resets to theta_i when no breach.
    source: project_state


# ═══════════════════════════════════════════════════════════════════════════════
# EVM METRICS
# ═══════════════════════════════════════════════════════════════════════════════

evm:
  - code: spi
    symbol: "\\mathrm{SPI}_{i,t}"
    name: schedule performance index
    domain: "\\mathrm{SPI}_{i,t} \\in \\mathbb{R}_{>0}"
    description: >
      Earned-Schedule SPI: ratio of earned schedule ES_i to actual time tau_i.
      SPI_{i,t} = ES_{i,t} / tau_i.  Continues to degrade past the planned
      finish date, unlike the classical BCWP/BCWS ratio.
    source: evm

  - code: cpi
    symbol: "\\mathrm{CPI}_{i,t}"
    name: cost performance index
    domain: "\\mathrm{CPI}_{i,t} \\in \\mathbb{R}_{>0}"
    description: >
      CPI_{i,t} = BCWP_{i,t} / ACWP_{i,t} = (EV_{i,t} * BAC_i) / CF^-_i.
    source: evm

  - code: eac
    symbol: "\\mathrm{EAC}_{i,t}"
    name: estimate at completion
    domain: "\\mathrm{EAC}_{i,t} \\in \\mathbb{R}_{>0}"
    description: >
      Composite EVM forecast of total cost using both cost and schedule
      inefficiency:
      EAC_{i,t} = ACWP_{i,t} + (BAC_i - BCWP_{i,t}) / (CPI_{i,t} * SPI_{i,t}).
    source: evm

  - code: tcpi
    symbol: "\\mathrm{TCPI}_{i,t}"
    name: to-complete performance index
    domain: "\\mathrm{TCPI}_{i,t} \\in \\mathbb{R}_{\\geq 0}"
    description: >
      Efficiency needed on remaining work to finish within BAC:
      TCPI_{i,t} = (BAC_i - BCWP_{i,t}) / (BAC_i - ACWP_{i,t}).
    source: evm


# ═══════════════════════════════════════════════════════════════════════════════
# S-CURVE & CATCHUP FIELDS
# ═══════════════════════════════════════════════════════════════════════════════

scurve_catchup:
  - code: planned_progress(t_project, ...)   # function call result
    symbol: "PV_i(\\tau)"
    name: planned progress function
    domain: "PV_i : [0,D_i] \\to [0,1]"
    description: >
      Beta CDF evaluated at tau/D_i: PV_i(tau) = F_Beta(tau/D_i; a_i, b_i)
      when D_i > 0; equals 1 for all tau when D_i = 0 (step function).
    source: project_state

  - code: progress_space_t
    symbol: "\\sigma^{\\mathrm{sp}}_{i,t}"
    name: progress space (current)
    domain: "\\sigma^{\\mathrm{sp}}_{i,t} \\in [-1,1]"
    description: >
      Remaining tolerance headroom at period t:
      sigma^sp_{i,t} = delta^max_i - delta_{i,t}.
    source: project_state

  - code: min_prog_t
    symbol: "\\underline{EV}_{i,t}"
    name: minimum required progress (current)
    domain: "\\underline{EV}_{i,t} \\in [0,1]"
    description: >
      Minimum cumulative progress needed by end of period t to avoid a
      breach: underline{EV}_{i,t} = max(0, PV_i(tau_i+1) - delta^max_i).
    source: project_state

  - code: progress_needed_t
    symbol: "\\Delta EV^{\\mathrm{need}}_{i,t}"
    name: progress increment needed (current)
    domain: "\\Delta EV^{\\mathrm{need}}_{i,t} \\geq 0"
    description: >
      Additional progress required this period to reach minimum_prog_t:
      max(0, underline{EV}_{i,t} - EV_{i,t}).
    source: project_state

  - code: catchup_alloc_t
    symbol: "x^{\\mathrm{cu}}_{i,t}"
    name: catchup allocation (current)
    domain: "x^{\\mathrm{cu}}_{i,t} \\geq 0"
    description: >
      Monetary allocation required to supply exactly progress_needed_t units
      of progress (assuming unit efficiency):
      x^cu_{i,t} = Delta EV^need_{i,t} * BAC_i.
    source: project_state

  - code: reach_plan_t
    symbol: "x^{\\mathrm{rp}}_{i,t}"
    name: reach-plan allocation (current)
    domain: "x^{\\mathrm{rp}}_{i,t} \\geq 0"
    description: >
      Allocation required to bring EV_{i,t} exactly to PV_i(tau_i+1)
      (on-plan progress) this period:
      x^rp_{i,t} = max(0, PV_i(tau_i+1) - EV_{i,t}) * BAC_i.
    source: project_state

  - code: progress_plan_next_t
    symbol: "PV_i(\\tau_i+2)"
    name: planned progress next period
    domain: "[0,1]"
    description: >
      Planned progress two project-steps ahead (lookahead horizon).
      Returns 1 when D_i = 0.
    source: project_state

  - code: progress_delay_next_t
    symbol: "\\delta^{+1}_{i,t}"
    name: projected progress delay next period
    domain: "\\in [-1,1]"
    description: >
      Progress delay projected for t+1 assuming zero allocation this period:
      delta^+1_{i,t} = PV_i(tau_i+1) - EV_{i,t}.
    source: project_state

  - code: catchup_alloc_next_t
    symbol: "x^{\\mathrm{cu}+1}_{i,t}"
    name: catchup allocation (next-period lookahead)
    domain: "x^{\\mathrm{cu}+1}_{i,t} \\geq 0"
    description: >
      Allocation this period required so that the projected delay at t+1
      does not exceed delta^max_i (one-step ahead breach prevention).
    source: project_state

  - code: reach_plan_next_t
    symbol: "x^{\\mathrm{rp}+1}_{i,t}"
    name: reach-plan allocation (next-period lookahead)
    domain: "x^{\\mathrm{rp}+1}_{i,t} \\geq 0"
    description: >
      Allocation required to bring EV_{i,t} to PV_i(tau_i+2):
      full on-plan progress for two periods ahead.
    source: project_state


# ═══════════════════════════════════════════════════════════════════════════════
# MILESTONE PROFILE  (fixed at episode start)
# ═══════════════════════════════════════════════════════════════════════════════

milestone_profile:
  - code: progress_threshold
    symbol: "\\psi_{i,j}"
    name: progress threshold
    domain: "\\psi_{i,j} \\in [0,1],\\; \\psi_{i,M_i}=1"
    description: >
      Minimum cumulative progress EV_{i,t} required to certify milestone j
      of project i.
    source: milestone_profile

  - code: timestep_threshold
    symbol: "\\tau^{\\mathrm{ms}}_{i,j}"
    name: timestep threshold (project-time)
    domain: "\\tau^{\\mathrm{ms}}_{i,j} \\in \\mathbb{Z}_{\\geq 0}"
    description: >
      Earliest project-time (tau_i) at which milestone j can be certified;
      episode-time threshold = s_i + tau^ms_{i,j}.
    source: milestone_profile

  - code: payment_weight
    symbol: "w_{i,j}"
    name: payment weight
    domain: "w_{i,j} \\geq 0,\\; \\sum_{j=1}^{M_i} w_{i,j} = 1"
    description: >
      Fraction of contract price P_i allocated to the gross payment of
      milestone j: gross_{i,j} = w_{i,j} * P_i.
    source: milestone_profile

  - code: gross_payment
    symbol: "G_{i,j}"
    name: gross milestone payment
    domain: "G_{i,j} \\in \\mathbb{R}_{\\geq 0}"
    description: >
      Raw contractual payment for milestone j before deductions:
      G_{i,j} = w_{i,j} * P_i.  For j=0 (advance): G_{i,0} = phi_i * P_i.
    source: milestone_profile

  - code: advance_recovery    # milestone-level deduction amount
    symbol: "A^{\\mathrm{rec}}_{i,j}"
    name: advance recovery deduction (per milestone)
    domain: "A^{\\mathrm{rec}}_{i,j} \\geq 0"
    description: >
      Advance recovery deduction at milestone j:
      A^rec_{i,j} = min(delta^rec_i * G_{i,j}, advance remaining)
      if G^cum_{i,j-1} >= psi^rec_i * P_i and phi_i > 0; else 0.
      See eq:advance_rec.
    source: milestone_profile

  - code: retention_withheld
    symbol: "R^{\\mathrm{held}}_{i,j}"
    name: retention withheld
    domain: "R^{\\mathrm{held}}_{i,j} \\geq 0"
    description: >
      Retention amount withheld at milestone j:
      R^held_{i,j} = nu_i * G_{i,j}.
    source: milestone_profile

  - code: retention_released
    symbol: "R^{\\mathrm{rel}}_{i,j}"
    name: retention released
    domain: "R^{\\mathrm{rel}}_{i,j} \\geq 0"
    description: >
      Cumulative retention released; zero for all non-final milestones;
      equals sum_{k<=j} R^held_{i,k} at the final milestone.
    source: milestone_profile

  - code: net_payment
    symbol: "\\hat{P}_{i,j}"
    name: net milestone payment
    domain: "\\hat{P}_{i,j} \\in \\mathbb{R}"
    description: >
      Cash actually received by the portfolio at milestone j certification:
      hat{P}_{i,j} = G_{i,j} - A^rec_{i,j} - R^held_{i,j} + R^rel_{i,j}.
    source: milestone_profile


# ═══════════════════════════════════════════════════════════════════════════════
# MILESTONE STATE  (updated during episode)
# ═══════════════════════════════════════════════════════════════════════════════

milestone_state:
  - code: certified
    symbol: "\\mathbb{1}^{\\mathrm{cert}}_{i,j,t}"
    name: certification indicator
    domain: "\\{0,1\\}"
    description: 1 if milestone j of project i has been certified by period t.
    source: milestone_state

  - code: certified_t
    symbol: "t^{\\mathrm{cert}}_{i,j}"
    name: certification time
    domain: "t^{\\mathrm{cert}}_{i,j} \\in \\{0,\\ldots,T\\} \\cup \\{\\text{null}\\}"
    description: Episode period at which milestone j was certified.
    source: milestone_state

  - code: certification_delay
    symbol: "\\Delta t^{\\mathrm{cert}}_{i,j}"
    name: certification delay
    domain: "\\Delta t^{\\mathrm{cert}}_{i,j} \\in \\mathbb{Z}"
    description: >
      Signed delay of actual vs planned certification:
      Delta t^cert_{i,j} = t^cert_{i,j} - (s_i + tau^ms_{i,j}).
    source: milestone_state

  - code: payment_released
    symbol: "\\hat{P}^{\\mathrm{paid}}_{i,j}"
    name: payment actually released
    domain: "\\in \\mathbb{R}_{\\geq 0}"
    description: Net payment amount credited to the portfolio budget at certification.
    source: milestone_state


# ═══════════════════════════════════════════════════════════════════════════════
# TARGET MILESTONE FIELDS  (next uncertified milestone lookahead)
# ═══════════════════════════════════════════════════════════════════════════════

target_milestone:
  - code: target_milestone_j
    symbol: "j^{*}_{i,t}"
    name: target milestone index
    domain: "j^{*}_{i,t} \\in \\{1,\\ldots,M_i\\} \\cup \\{\\text{null}\\}"
    description: Index of the next uncertified milestone for project i at period t.
    source: project_state

  - code: target_progress_gap
    symbol: "\\Delta\\psi^{*}_{i,t}"
    name: target progress gap
    domain: "\\Delta\\psi^{*}_{i,t} \\in [0,1]"
    description: >
      Additional progress needed to certify the target milestone:
      Delta psi^*_{i,t} = max(0, psi_{i,j^*} - EV_{i,t}).
    source: project_state

  - code: target_timestep_gap
    symbol: "\\Delta\\tau^{*}_{i,t}"
    name: target timestep gap
    domain: "\\Delta\\tau^{*}_{i,t} \\in \\mathbb{Z}"
    description: >
      Periods remaining until the target milestone's episode-time deadline:
      Delta tau^*_{i,t} = (s_i + tau^ms_{i,j^*}) - t.
    source: project_state

  - code: target_net_payment
    symbol: "\\hat{P}^{*}_{i,t}"
    name: target net payment
    domain: "\\hat{P}^{*}_{i,t} \\in \\mathbb{R}"
    description: Net payment that will be received upon certifying the target milestone.
    source: project_state

  - code: target_required_alloc
    symbol: "x^{*}_{i,t}"
    name: target required allocation
    domain: "x^{*}_{i,t} \\geq 0"
    description: >
      Monetary allocation required to close the target progress gap:
      x^*_{i,t} = Delta psi^*_{i,t} * BAC_i.
    source: project_state

  - code: target_payment_rate
    symbol: "\\rho^{*}_{i,t}"
    name: target payment rate
    domain: "\\rho^{*}_{i,t} \\geq 0"
    description: >
      Ratio of expected net payment to required investment:
      rho^*_{i,t} = hat{P}^*_{i,t} / x^*_{i,t}.
    source: project_state

  - code: target_npv
    symbol: "\\mathrm{NPV}^{*}_{i,t}"
    name: target milestone NPV
    domain: "\\in \\mathbb{R}"
    description: >
      Net present value of unlocking the target milestone:
      NPV^*_{i,t} = hat{P}^*_{i,t} / gamma^{max(0, Delta tau^*_{i,t})} - x^*_{i,t}.
    source: project_state


# ═══════════════════════════════════════════════════════════════════════════════
# BREACH & TERMINATION
# ═══════════════════════════════════════════════════════════════════════════════

breach:
  - code: over_progress_delay    # breach_flags key
    symbol: "\\mathbb{1}^{\\delta}_{i,t}"
    name: progress delay breach flag
    domain: "\\{0,1\\}"
    description: >
      1 if delta_{i,t} > delta^max_i (project is behind plan beyond tolerance).
      Evaluated in the late phase after allocation and progress realisation.
    source: breach

  - code: over_duration_window   # breach_flags key
    symbol: "\\mathbb{1}^{T}_{i,t}"
    name: hard deadline breach flag
    domain: "\\{0,1\\}"
    description: >
      1 if t >= f_i + Delta^max_i - 1 (hard time-out, zero-indexed horizon);
      triggers immediate termination regardless of tolerance_remain.
      Evaluated in the early phase before allocation.
    source: breach

  - code: over_any               # breach_flags key
    symbol: "\\mathbb{1}^{\\mathrm{any}}_{i,t}"
    name: any breach flag
    domain: "\\{0,1\\}"
    description: >
      1 if any breach condition holds this period (currently equals
      over_progress_delay).
    source: breach

  - code: termination_settlement  # proj_cf["settlement"] / ps key
    symbol: "S_i"
    name: termination settlement
    domain: "S_i \\in \\mathbb{R}"
    description: >
      Net cash-flow on project termination:
      S_i = EV_i * P_i - CF^+_i.
      Positive: portfolio receives funds; negative: portfolio pays out.
    source: project_state


# ═══════════════════════════════════════════════════════════════════════════════
# OBSERVATION VECTOR  (7 * N + 2 elements)
# ═══════════════════════════════════════════════════════════════════════════════

observation_vector:
  description: >
    The observation o_t in R^{7N+2} is constructed by concatenating
    per-project features (indices 7i through 7i+6 for project i) followed by
    two portfolio-level scalars.  All values are clipped to [low, high]
    as defined in the Box observation space.  Pending and completed projects
    have all per-project fields set to zero.
  per_project_features:
    - index: 7i+0
      code: tolerance_remain
      symbol: "\\theta^{\\mathrm{rem}}_{i,t}"
      clip: "[0, theta_i]"
      description: Cure-period tolerance remaining.
    - index: 7i+1
      code: catchup_alloc_t / initial_budget
      symbol: "\\tilde{x}^{\\mathrm{cu}}_{i,t}"
      clip: "[0, 1]"
      description: Current catchup allocation normalised by B_0.
    - index: 7i+2
      code: catchup_alloc_next_t / initial_budget
      symbol: "\\tilde{x}^{\\mathrm{cu}+1}_{i,t}"
      clip: "[0, 1]"
      description: Next-period catchup allocation normalised by B_0.
    - index: 7i+3
      code: target_progress_gap
      symbol: "\\Delta\\psi^{*}_{i,t}"
      clip: "[0, 1]"
      description: Progress gap to target milestone.
    - index: 7i+4
      code: target_timestep_gap / horizon
      symbol: "\\widetilde{\\Delta\\tau}^{*}_{i,t}"
      clip: "[-1, 1]"
      description: Target milestone timestep gap normalised by T.
    - index: 7i+5
      code: target_required_alloc / initial_budget
      symbol: "\\tilde{x}^{*}_{i,t}"
      clip: "[0, 1]"
      description: Allocation required to reach target milestone normalised by B_0.
    - index: 7i+6
      code: target_npv / max_abs(target_npv)
      symbol: "\\widetilde{\\mathrm{NPV}}^{*}_{i,t}"
      clip: "[-1, 1]"
      description: >
        Target milestone NPV normalised by max absolute NPV across active
        projects in the portfolio.
  portfolio_features:
    - index: 7N+0
      code: _last_net_cashflow / initial_budget
      symbol: "\\widetilde{\\Delta B}_{t}"
      clip: "[-2, 2]"
      description: Last-period net cash-flow normalised by B_0.
    - index: 7N+1
      code: budget / initial_budget
      symbol: "\\tilde{B}_t"
      clip: "[0, 2]"
      description: Current available budget normalised by B_0.


# ═══════════════════════════════════════════════════════════════════════════════
# BASELINE SOLVERS
# ═══════════════════════════════════════════════════════════════════════════════

baseline_solvers:
  - code: METHOD_NAME = "reach_t"
    symbol: "\\pi^{\\mathrm{rp}}"
    name: Reach-Plan solver
    description: >
      Deterministic policy that allocates x^rp_{i,t} to each active project,
      fully closing the gap to PV_i(tau_i+1) each period.

  - code: METHOD_NAME = "catchup_t"
    symbol: "\\pi^{\\mathrm{cu}}"
    name: Catchup-T solver
    description: >
      Deterministic policy that allocates x^cu_{i,t} to each active project,
      staying within the progress delay cap while minimising expenditure.
      Switches to x^rp_{i,t} when tau_i >= D_i.

  - code: METHOD_NAME = "catchup_next_t"
    symbol: "\\pi^{\\mathrm{cu}+1}"
    name: Catchup-Next-T solver
    description: >
      Risk-averse policy that allocates x^{cu+1}_{i,t}, ensuring the
      projected delay at t+1 also remains within delta^max_i (one-step
      lookahead breach prevention).

  - code: METHOD_NAME = "optimal"
    symbol: "\\pi^{*}"
    name: Full-information optimal (manual)
    description: >
      Hand-crafted allocation computed with full knowledge of stochastic
      realisations.  Serves as an upper-bound reference; not a tractable
      solver — implementation of an LP or DP solver is left as future work.


# ═══════════════════════════════════════════════════════════════════════════════
# CONFIG DISTRIBUTION FIELDS  (naming convention)
# ═══════════════════════════════════════════════════════════════════════════════

config_convention:
  description: >
    Every stochastic parameter X in the config dict is specified by four
    fields: X_dist (distribution family), X_p1, X_p2, X_p3, X_p4.
    For custom_ordinal, X_p1 holds the explicit sequence (flat list for
    single-project configs; list of lists for portfolio configs).
    annual_interest_rate is the sole exception: it is a plain scalar
    with no _dist suffix.
  distributions:
    fixed:            "X = p1  (deterministic)"
    uniform:          "X ~ Uniform(p1, p2)"
    normal:           "X ~ Normal(p1, p2)"
    lognormal:        "X ~ LogNormal(p1, p2)"
    triangular:       "X ~ Triangular(p1, p3, p2)  [min, mode, max]"
    beta:             "X ~ Beta(p1, p2)"
    truncated_normal: "X ~ Normal(p1, p2) truncated to [p3, p4]"
    custom_ordinal:   "X = p1[episode_idx % len(p1)]  (cycles deterministically)"